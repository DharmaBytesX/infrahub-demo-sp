---
services:
  database:
    environment:
      - NEO4J_dbms_memory_transaction_total_max=8g
      - NEO4J_dbms_memory_heap_initial__size=2g
      - NEO4J_dbms_memory_heap_max__size=4g
      - NEO4J_dbms_memory_pagecache_size=2g

  infrahub-server:
    ports:
      - "${INFRAHUB_PORT:-8000}:8000"

  task-manager:
    ports:
      - "${PREFECT_PORT:-4200}:4200"

  task-worker:
    environment:
      # The registered BatfishBackboneCheck runs here (in the stock infrahub
      # image, which has no pybatfish). It POSTs configs to the batfish-runner
      # sidecar instead of importing pybatfish locally.
      - BATFISH_RUNNER_URL=http://batfish-runner:8080
    volumes:
      - ./:/upstream

  streamlit-service-catalog:
    # Published by .github/workflows/publish-images.yml. To build it from this
    # checkout instead, see docker-compose.catalog-dev.yml.
    image: ${STREAMLIT_IMAGE:-registry.opsmill.io/opsmill/infrahub-demo-sp-streamlit:main}
    container_name: service-catalog
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      - INFRAHUB_ADDRESS=http://infrahub-server:8000
      - INFRAHUB_UI_URL=${INFRAHUB_UI_URL:-http://localhost:8000}
      - INFRAHUB_API_TOKEN=${INFRAHUB_API_TOKEN:-06438eb2-8019-4776-878c-0941b1f1d1ec}
      - DEFAULT_BRANCH=main
      - GENERATOR_WAIT_TIME=60
      # Batfish Check page targets — defaults match the sidecar service
      # below; override here if the topology changes.
      - BATFISH_HOST=batfish
      - BATFISH_PORT=9996
    depends_on:
      - infrahub-server
    profiles:
      - service-catalog
    networks:
      - default

  batfish:
    image: batfish/allinone:latest
    # batfish/allinone is published for linux/amd64 only (no arm64 variant),
    # so pin the platform explicitly. On Apple Silicon Docker runs it under
    # emulation; this silences the "platform does not match" warning and makes
    # the intent explicit (works the same on native amd64 hosts).
    platform: linux/amd64
    container_name: batfish
    restart: unless-stopped
    networks:
      - default

  batfish-runner:
    # Owns the pybatfish engine so the stock task-worker image doesn't have to.
    # The BatfishBackboneCheck POSTs configs to /check; this service drives the
    # batfish sidecar and returns findings as JSON. Published by
    # .github/workflows/publish-images.yml; to build it from this checkout
    # instead, see docker-compose.catalog-dev.yml.
    image: ${BATFISH_RUNNER_IMAGE:-registry.opsmill.io/opsmill/infrahub-demo-sp-batfish-runner:main}
    container_name: batfish-runner
    restart: unless-stopped
    environment:
      - BATFISH_HOST=batfish
      - BATFISH_PORT=9996
    ports:
      # Exposed so the host-side `uv run invoke batfish` task can reach it at
      # http://localhost:${BATFISH_RUNNER_PORT}.
      - "${BATFISH_RUNNER_PORT:-8080}:8080"
    depends_on:
      - batfish
    networks:
      - default
